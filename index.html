<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock - Paper - Scissors</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="game-grid">
      <div class="user-buttons">
        <button id="rock-button">🪨</button>
        <button id="paper-button">📃</button>
        <button id="scissors-button">✂️</button>
      </div>

      <div class="user-selection">
        <h2>YOU</h2>
        <!-- TODO: Add image with all three options -->
        <div id="user-selection-image"><img src="" alt="" /></div>
      </div>
      <div class="comp-selection">
        <h2>COMP</h2>
        <!-- TODO: Add image with all three options -->
        <div id="comp-selection-image"><img src="" alt="" /></div>
      </div>

      <div class="score-card">
        <ul>
          <li>Wins:<span id="wins">0</span></li>
          <li>Losses:<span id="losses">0</span></li>
          <li>Ties:<span id="ties">0</span></li>
        </ul>
      </div>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
