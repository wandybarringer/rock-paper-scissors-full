<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock - Paper - Scissors</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="user-buttons">
      <button id="rock-button"></button>
      <button id="paper-button"></button>
      <button id="scissors-button"></button>
    </div>
    <div class="choices-body">
      <div class="user-wrapper">
        <div class="user-selection selection-static">
          <div id="user-selection-image"></div>
        </div>
      </div>
      <div class="cpu-wrapper">
        <div class="comp-selection selection-static">
          <div id="comp-selection-image"></div>
        </div>
      </div>
    </div>
    <div class="score-cards">
      <ul>
        <li>YOU</li>
        <li id="user-score">0</li>
      </ul>
      <ul class="play-counter-card">
        <li>PLAYS</li>
        <li id="plays">0</li>
      </ul>
      <ul>
        <li>CPU</li>
        <li id="computer-score">0</li>
      </ul>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
